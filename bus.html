<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bus.css">
    <title>Pop-up Notification</title>
</head>
<body>

<!-- Trigger Button -->
<button id="openPopupBtn">Open Notification</button>

<!-- Pop-up Notification -->
<div id="popupNotification" class="popup">
    <div class="popup-content">
        <span class="close-btn">&times;</span>
        <h2>Notification </h2>
        <p>The bus will arrive in 5 mins</p>
        <p>The bus came near Elcot Avenue Road</p>
    </div>
</div>

<script src="bus.js"></script>
</body>
</html>
